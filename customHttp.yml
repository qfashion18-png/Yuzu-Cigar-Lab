customHeaders:
  - pattern: "**"
    headers:
      - key: "Strict-Transport-Security"
        value: "max-age=63072000; includeSubDomains; preload"
      - key: "Content-Security-Policy"
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.agechecker.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https://swwest.com https://halfwheel.com https://cigardojo.com https://classroom2.s3.us-east-1.amazonaws.com https://api.agechecker.net https://cdn.agechecker.net https://www.googletagmanager.com https://www.google-analytics.com data: blob:; font-src 'self' https://cdn.agechecker.net https://fonts.gstatic.com data:; connect-src 'self' https://api.yuzucigarclub.com https://*.execute-api.us-east-1.amazonaws.com https://api.agechecker.net https://*.amazoncognito.com https://cognito-idp.us-east-1.amazonaws.com https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://stats.g.doubleclick.net; media-src 'self' blob:; frame-src https://js.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'; upgrade-insecure-requests"
      - key: "X-Frame-Options"
        value: "DENY"
      - key: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - key: "Permissions-Policy"
        value: "camera=(self), microphone=(), geolocation=(), payment=(self \"https://checkout.stripe.com\")"
      - key: "X-Content-Type-Options"
        value: "nosniff"

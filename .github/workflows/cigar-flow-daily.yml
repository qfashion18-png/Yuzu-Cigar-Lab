name: Cigar Flow Daily Newsroom Refresh

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cigar-flow-daily-newsroom
  cancel-in-progress: false

jobs:
  daily-cigar-news-refresh:
    name: Create source-backed daily Cigar Flow draft
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run daily Cigar Flow automation
        env:
          NEXT_PUBLIC_YCC_API_BASE_URL: https://api.yuzucigarclub.com
          NEXT_PUBLIC_COGNITO_HOSTED_UI_BASE: ${{ secrets.NEXT_PUBLIC_COGNITO_HOSTED_UI_BASE }}
          NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID }}
          NEXT_PUBLIC_COGNITO_ISSUER: ${{ secrets.NEXT_PUBLIC_COGNITO_ISSUER }}
          YCC_NEWSROOM_COGNITO_USERNAME: ${{ secrets.YCC_NEWSROOM_COGNITO_USERNAME }}
          YCC_NEWSROOM_COGNITO_PASSWORD: ${{ secrets.YCC_NEWSROOM_COGNITO_PASSWORD }}
          YCC_NEWSROOM_BEARER_TOKEN: ${{ secrets.YCC_NEWSROOM_BEARER_TOKEN }}
          YCC_DAILY_NEWSROOM_AUTO_PUBLISH: "false"
          YCC_DAILY_NEWSROOM_DEDUPE_PREFLIGHT: "true"
          YCC_DAILY_NEWSROOM_FETCH_SOURCE_EVIDENCE: "true"
          YCC_DAILY_NEWSROOM_REQUIRE_SOURCE_EVIDENCE: "true"
          YCC_DAILY_NEWSROOM_REQUIRE_FRESH_LEADS: "true"
          YCC_DAILY_NEWSROOM_RSS_MAX_AGE_HOURS: "72"
          YCC_DAILY_NEWSROOM_SOURCE_LIMIT: "3"
          YCC_DAILY_NEWSROOM_VERIFY_PUBLISHED: "false"
        run: npm run cigar-flow:daily

      - name: Upload draft and run outcome for operator review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cigar-flow-draft-${{ github.run_id }}
          path: |
            output/cigar-flow-drafts/*.json
            output/cigar-flow-run-status.json
          if-no-files-found: error
          retention-days: 14
